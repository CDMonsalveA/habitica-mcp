name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the tool call and the error message. Never paste your API token.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: habitica-mcp version (output of habitica-mcp --version)
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and model (for example Claude Desktop with Sonnet, Cursor, Ollama with qwen3)
  - type: textarea
    id: logs
    attributes:
      label: Server logs (stderr, with HABITICA_MCP_LOG_LEVEL=INFO)
      render: text
