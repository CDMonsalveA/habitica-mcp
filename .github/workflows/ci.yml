name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Tests (unit, integration, tool contract, stdio end-to-end)
        run: uv run pytest --cov --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Build
        run: uv build
      - name: The built wheel starts
        run: uvx --from dist/*.whl habitica-mcp --version
      - name: Dependency audit
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit --requirement requirements.txt --disable-pip
