name: Live contract tests

# Talks to the real Habitica API with a dedicated test account to detect API changes.
# Never runs on pull requests, so secrets are not exposed to code from forks.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Run contract tests
        env:
          HABITICA_TEST_USER_ID: ${{ secrets.HABITICA_TEST_USER_ID }}
          HABITICA_TEST_API_TOKEN: ${{ secrets.HABITICA_TEST_API_TOKEN }}
        run: uv run pytest -m contract -v
      - name: Open an issue when Habitica changed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          gh issue create
          --repo "$GITHUB_REPOSITORY"
          --title "Live contract tests failed on $(date -u +%Y-%m-%d)"
          --label habitica-api
          --body "The weekly contract tests against habitica.com failed: $RUN_URL
          Check for Habitica API changes, then update the gateway and the test double."
