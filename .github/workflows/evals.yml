name: LLM evals

# Manual on purpose: every run consumes Claude subscription usage (or API credits).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Claude Code model alias"
        type: choice
        options: [haiku, sonnet, opus]
        default: sonnet
      split:
        description: "Case split"
        type: choice
        options: [dev, heldout, all]
        default: dev
      repeat:
        description: "Runs per case"
        type: choice
        options: ["1", "2", "3"]
        default: "1"

permissions: {}

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: Run evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          SPLIT: ${{ inputs.split }}
          REPEAT: ${{ inputs.repeat }}
        run: uv run python -m evals run --driver claude_code --model "$MODEL" --split "$SPLIT" --repeat "$REPEAT"
      - name: Job summary
        if: always()
        run: cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: evals/results/
